[pytest]
# Pytest configuration for Cloud Lab Platform

# Minimum version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Asyncio mode (required for async tests)
asyncio_mode = auto

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Coverage options
# Run with: pytest --cov=backend --cov-report=html
# Or: pytest --cov=backend --cov-report=term-missing

# Markers for organizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, real DB)
    auth: Authentication tests
    oauth: OAuth/SSO tests
    mfa: Multi-factor authentication tests
    security: Security-related tests
    slow: Slow running tests
    db: Tests requiring database

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_file = tests/pytest.log
log_file_level = DEBUG
